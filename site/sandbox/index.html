<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade Shortcuts Sandbox</title>
  <meta name="description" content="The real Trade Shortcuts app in your browser: a shortcut on the phone, the BTC price on a simulated exchange, the answer on the glasses." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="top">
    <a href="../" class="brand" aria-label="Trade Shortcuts home"><img src="favicon.svg" alt="" width="32" height="32" /></a>
    <span class="brand-title">Sandbox</span>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Scenarios"></nav>
  <div id="spotlight-mask" class="spotlight-mask" aria-hidden="true" hidden></div>

  <main id="panel" class="panel" role="tabpanel" data-view="glasses" data-side="phone">
    <div id="views" class="views" role="group" aria-label="Sandbox view">
      <button type="button" data-view="phone" aria-controls="rule-panel" aria-pressed="false">Rule</button>
      <button type="button" data-view="chart" aria-controls="market-panel" aria-pressed="false">Market</button>
      <button type="button" data-view="glasses" aria-controls="glasses-panel" aria-pressed="true">Glasses</button>
    </div>
    <section id="glasses-panel" class="device glasses" aria-label="Glasses">
      <div class="sim">
        <div class="sim-title">Glasses Display</div>
        <canvas id="lens" width="576" height="288" tabindex="-1" role="img" aria-label="What the glasses show. Click to tap."></canvas>
        <div class="sim-bar" role="group" aria-label="Ring and temple">
          <button type="button" data-gesture="up">Up</button>
          <button type="button" data-gesture="down">Down</button>
          <button type="button" data-gesture="tap">Click</button>
          <button type="button" data-gesture="double">Double Click</button>
          <button type="button" data-gesture="long" data-free-control>Long Press</button>
          <button type="button" data-gesture="menu" data-free-control>Menu</button>
        </div>
      </div>
    </section>
    <section id="rule-panel" class="device phone-col" aria-label="Phone">
      <div class="phone"><iframe id="phone" title="Trade Shortcuts on the phone"></iframe></div>
    </section>
    <section id="market-panel" class="device exchange-col" aria-label="Exchange">
      <div class="phone phone--dark"><div id="exchange" class="screen"></div></div>
    </section>
    <div class="guide">
      <div class="guide-actions">
        <button class="sl-playback" id="scenario-play" type="button" data-playing="false" aria-label="Play demo" disabled>
          <span class="sl-playback__surface" aria-hidden="true">
            <span class="sl-playback__icon">
              <span class="sl-playback__piece sl-playback__piece--left"></span>
              <span class="sl-playback__piece sl-playback__piece--right"></span>
            </span>
            <span class="sl-playback__label">Play demo</span>
          </span>
        </button>
        <button type="button" id="restart" class="secondary" hidden>Start over</button>
      </div>
      <ol id="steps" class="steps" aria-live="polite"></ol>
      <p id="result" class="result" role="status" hidden></p>
      <p id="next-prompt" class="next-prompt" role="status" hidden>Now try it by yourself. Choose template and drag the price.</p>
      <p id="note" class="sim-note" role="status"></p>
    </div>
  </main>

  <script type="module" src="./src/page.ts"></script>
</body>
</html>
